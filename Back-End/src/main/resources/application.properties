# Datasource SELECT POSTGRESQL
db.select.url=jdbc:postgresql://localhost:5432/tripfy
db.select.username=${POSTGRES_SELECT_USERNAME}
db.select.password=${POSTGRES_SELECT_PASSWORD}

# Datasource INSERT
db.insert.url=jdbc:postgresql://localhost:5432/tripfy
db.insert.username=${POSTGRES_INSERT_USERNAME}
db.insert.password=${POSTGRES_INSERT_PASSWORD}

# Datasource UPDATE
db.update.url=jdbc:postgresql://localhost:5432/tripfy
db.update.username=${POSTGRES_UPDATE_USERNAME}
db.update.password=${POSTGRES_UPDATE_PASSWORD}

# Datasource DELETE
db.delete.url=jdbc:postgresql://localhost:5432/tripfy
db.delete.username=${POSTGRES_DELETE_USERNAME}
db.delete.password=${POSTGRES_DELETE_PASSWORD}

# Migration
spring.liquibase.url=jdbc:postgresql://localhost:5432/tripfy
spring.liquibase.user=${POSTGRES_MIGRATION_USERNAME}
spring.liquibase.password=${POSTGRES_MIGRATION_PASSWORD}
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Liquibase parameters
spring.liquibase.parameters.apiSelectPassword=${POSTGRES_SELECT_PASSWORD}
spring.liquibase.parameters.apiInsertPassword=${POSTGRES_INSERT_PASSWORD}
spring.liquibase.parameters.apiUpdatePassword=${POSTGRES_UPDATE_PASSWORD}
spring.liquibase.parameters.apiDeletePassword=${POSTGRES_DELETE_PASSWORD}



