spring.application.name=tripfy

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Env
spring.config.import=optional:file:.env[.properties]

# Google
google.places.api-key=${GOOGLE_PLACES_API_KEY}
oauth.google.client-id=${GOOGLE_CLIENT_ID}

# Apple
oauth.apple.bundle-id=${APPLE_BUNDLE_ID}

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-minutes=60
# jwt.access-token-expiration-minutes=15
jwt.refresh-token-expiration-days=7



