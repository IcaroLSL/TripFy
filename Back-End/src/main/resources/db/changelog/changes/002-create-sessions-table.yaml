databaseChangeLog:
  - changeSet:
      id: 002-create-sessions-table
      author: tripfy
      changes:
        - createTable:
            tableName: sessions
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_sessions_user
                    references: users(id)
              - column:
                  name: access_token
                  type: VARCHAR(512)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: refresh_token
                  type: VARCHAR(512)
                  constraints:
                    unique: true
              - column:
                  name: ip_address
                  type: VARCHAR(45)
              - column:
                  name: user_agent
                  type: TEXT
              - column:
                  name: expires_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: revoked_at
                  type: TIMESTAMP WITH TIME ZONE
        - createIndex:
            indexName: idx_sessions_user_id
            tableName: sessions
            columns:
              - column:
                  name: user_id
