databaseChangeLog:
  - changeSet:
      id: 003-create-status-logs-table
      author: tripfy
      changes:
        - sql:
            sql: |
              CREATE TABLE status_logs (
                  id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                  user_id BIGINT NOT NULL REFERENCES users(id) ON DELETE CASCADE,
                  changed_by BIGINT REFERENCES users(id) ON DELETE SET NULL,
                  change_time TIMESTAMPTZ NOT NULL DEFAULT now(),
                  old_status BOOLEAN NOT NULL,
                  new_status BOOLEAN NOT NULL,
                  ip_address INET,
                  CHECK (old_status != new_status)
              );

              CREATE INDEX idx_status_logs_user_id ON status_logs(user_id);
              CREATE INDEX idx_status_logs_change_time ON status_logs(change_time);
              CREATE INDEX idx_status_logs_changed_by ON status_logs(changed_by);
              