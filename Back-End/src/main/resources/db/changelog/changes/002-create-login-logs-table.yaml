databaseChangeLog:
  - changeSet:
      id: 003-create-login-logs-table
      author: tripfy
      changes:
        - sql:
            sql: |
              CREATE TABLE login_logs (
                  id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                  user_id BIGINT REFERENCES users(id) ON DELETE SET NULL,
                  attempt_time TIMESTAMPTZ NOT NULL DEFAULT now(),
                  success BOOLEAN NOT NULL,
                  ip_address INET,
                  failure_reason TEXT,
                  CHECK (
                      (success = true AND failure_reason IS NULL) OR
                      (success = false AND failure_reason IS NOT NULL)
                  )
              );

              CREATE INDEX idx_login_logs_user_id ON login_logs(user_id);
              CREATE INDEX idx_login_logs_attempt_time ON login_logs(attempt_time);
              CREATE INDEX idx_login_logs_success ON login_logs(success);
              