databaseChangeLog:
  - changeSet:
      id: 007-fix-password-nullable-and-add-email
      author: tripfy
      changes:
        - dropNotNullConstraint:
            tableName: users
            columnName: password
            columnDataType: varchar(255)

        - addColumn:
            tableName: users
            columns:
              - column:
                  name: email
                  type: varchar(255)
                  constraints:
                    nullable: true

        - addUniqueConstraint:
            tableName: users
            columnNames: email
            constraintName: uk_users_email

        - sql:
            sql: |
              ALTER TABLE users ADD CONSTRAINT chk_users_email_format
              CHECK (email IS NULL OR email ~ '^[^@\s]+@[^@\s]+\.[^@\s]+$');
