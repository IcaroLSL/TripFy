databaseChangeLog:
  - changeSet:
      id: 004-create-api-select-role
      author: tripfy
      changes:
        - sql:
            sql: |
              CREATE ROLE api_select NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT LOGIN NOREPLICATION NOBYPASSRLS PASSWORD '${apiSelectPassword}';
              GRANT USAGE ON SCHEMA public TO api_select;
              GRANT SELECT ON ALL TABLES IN SCHEMA public TO api_select;
              GRANT SELECT ON ALL SEQUENCES IN SCHEMA public TO api_select;
              ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO api_select;

