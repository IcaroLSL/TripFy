databaseChangeLog:
  - changeSet:
      id: 001-create-userrole-enum
      author: tripfy
      changes:
        - sql:
            sql: CREATE TYPE USERROLE AS ENUM ('admin', 'user', 'sponsor');

  - changeSet:
      id: 001-create-users-table
      author: tripfy
      changes:
        - sql:
            sql: |
              CREATE TABLE users (
                  id BIGINT PRIMARY KEY DEFAULT (
                      (EXTRACT(EPOCH FROM now()) * 1000000)::BIGINT +
                      (EXTRACT(MICROSECONDS FROM now())::BIGINT % 1000000)
                  ),
                  name VARCHAR(100) NOT NULL CHECK (
                      name !~ '--' AND
                      name !~ '/\*' AND
                      name !~ '\*/'
                  ),
                  username VARCHAR(150) UNIQUE NOT NULL CHECK (
                      username !~ '--' AND
                      username !~ '/\*' AND
                      username !~ '\*/'
                  ),
                  password VARCHAR(255) NOT NULL CHECK (
                      password !~ '--' AND
                      password !~ '/\*' AND
                      password !~ '\*/'
                  ),
                  role USERROLE NOT NULL DEFAULT 'user',
                  status_active BOOLEAN NOT NULL DEFAULT true,
                  date_created TIMESTAMPTZ NOT NULL DEFAULT now(),
                  date_updated TIMESTAMPTZ NOT NULL DEFAULT now()
              );

  - changeSet:
      id: 001-create-users-date-updated-trigger
      author: tripfy
      changes:
        - sql:
            splitStatements: false
            sql: |
             CREATE OR REPLACE FUNCTION update_date_updated_column()
             RETURNS TRIGGER AS $$
             BEGIN
                 NEW.date_updated = now();
                 RETURN NEW;
             END;
             $$ LANGUAGE plpgsql;
  
             CREATE TRIGGER update_users_date_updated
             BEFORE UPDATE ON users
             FOR EACH ROW
             EXECUTE FUNCTION update_date_updated_column();