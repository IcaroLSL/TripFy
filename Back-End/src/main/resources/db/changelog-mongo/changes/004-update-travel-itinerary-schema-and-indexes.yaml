databaseChangeLog:

  - changeSet:
      id: 004-alter-travel-route-validator
      author: tripfy
      changes:
        - runCommand:
            command: |
              {
                collMod: "travelRoute",
                validator: {
                  $jsonSchema: {
                    bsonType: "object",
                    required: [
                      "name", "ownersId", "places", "coverImage", "location",
                      "category", "likes", "priceLevel",
                      "date_created", "date_updated"
                    ],
                    properties: {
                      _id: { bsonType: "objectId" },
                      name: { bsonType: "string", minLength: 1 },
                      ownersId: {
                        bsonType: "array",
                        items: { bsonType: "string" }
                      },
                      places: {
                        bsonType: "array",
                        items: {
                          bsonType: "object",
                          required: ["morning", "afternoon", "night"],
                          properties: {
                            morning:   { bsonType: "array", items: { bsonType: "string" } },
                            afternoon: { bsonType: "array", items: { bsonType: "string" } },
                            night:     { bsonType: "array", items: { bsonType: "string" } }
                          }
                        }
                      },
                      coverImage: { bsonType: "string", minLength: 1 },
                      location:   { bsonType: "string", minLength: 1 },
                      category: {
                        bsonType: "array",
                        items: { bsonType: "string" }
                      },
                      likes: {
                        bsonType: "array",
                        items: { bsonType: "string" }
                      },
                      priceLevel: { bsonType: ["int", "null"], minimum: 0 },
                      date_created: { bsonType: "date" },
                      date_updated: { bsonType: "date" }
                    }
                  }
                }
              }

  - changeSet:
      id: 004-alter-itinerary-validator
      author: tripfy
      changes:
        - runCommand:
            command: |
              {
                collMod: "itinerary",
                validator: {
                  $jsonSchema: {
                    bsonType: "object",
                    required: [
                      "travelRouteId", "userId", "beginningDate", "endingDate",
                      "date_created", "date_updated"
                    ],
                    properties: {
                      _id: { bsonType: "objectId" },
                      travelRouteId: { bsonType: "string", pattern: "^[0-9a-f]{24}$" },
                      userId: { bsonType: "string", minLength: 1 },
                      beginningDate: { bsonType: "date" },
                      endingDate:    { bsonType: "date" },
                      date_created:  { bsonType: "date" },
                      date_updated:  { bsonType: "date" }
                    }
                  }
                }
              }

  - changeSet:
      id: 004-indexes-travel-route
      author: tripfy
      changes:
        - runCommand:
            command: |
              {
                createIndexes: "travelRoute",
                indexes: [
                  { key: { ownersId: 1 }, name: "idx_travelRoute_ownersId" }
                ]
              }

  - changeSet:
      id: 004-indexes-itinerary
      author: tripfy
      changes:
        - runCommand:
            command: |
              {
                createIndexes: "itinerary",
                indexes: [
                  { key: { userId: 1 },        name: "idx_itinerary_userId" },
                  { key: { travelRouteId: 1 }, name: "idx_itinerary_travelRouteId" }
                ]
              }