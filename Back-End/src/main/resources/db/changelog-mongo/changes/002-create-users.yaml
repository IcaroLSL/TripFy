databaseChangeLog:
  - changeSet:
      id: 002-create-user-select
      author: tripfy
      changes:
        - runCommand:
            command: |
              {
                createUser: "${mongoSelectUser}",
                pwd: "${mongoSelectPassword}",
                roles: [{ role: "somenteLeitura", db: "tripfy" }]
              }

  - changeSet:
